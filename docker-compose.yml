services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: alphapilot-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-alphapilot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - alphapilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-alphapilot}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  alphapilot_pgdata:

